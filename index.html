<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>視覚と注意</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #222; color: #fff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden;
        }
        .container {
            text-align: center; background: #333;
            padding: 40px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 800px;
        }
        .hidden { display: none !important; }
        button { padding: 12px 24px; font-size: 18px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; margin-top: 20px; }
        button:hover { background: #0056b3; }
        
        #video-container { position: relative; display: inline-block; }
        video { display: block; max-width: 1000px; cursor: crosshair; }
        
        /* 动态红圈的特效动画：出现后逐渐变大并变透明消失 */
        .click-marker {
            position: absolute; width: 30px; height: 30px;
            border: 3px solid red; border-radius: 50%;
            pointer-events: none; 
            animation: fadeOut 0.6s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
        }
    </style>
</head>
<body>

    <div id="intro-screen" class="container">
        <h2>視覚と注意</h2>
        <p style="color: #ffcccc; font-size: 1.2em; font-weight: bold; line-height: 1.6;">
            ・絶対に変化したと確信した場合に、その変化箇所をクリックしてください。<br>
            ・複数変化がある場合、何度でもクリックできます。<br>
            <span style="color: #ffeb3b;">・画面右下のロゴの変化は無視してください（クリック不要です）。</span>
        </p>
        <p>※本実験は匿名で行われます。個人情報は取得しません。</p>
        <button onclick="startExperiment()">実験を開始する</button>
    </div>

    <div id="experiment-screen" class="hidden">
        <h3 id="trial-counter" style="text-align: center;">Trial 1 / 5</h3>
        <div id="video-container">
            <video id="stimulus-video" preload="auto" muted playsinline>
                <source src="" type="video/mp4">
            </video>
        </div>
        <p style="text-align: center; margin-top: 15px;">変化を見つけたら、動画のその場所をクリックしてください（複数回クリック可能）</p>
    </div>

    <div id="end-screen" class="container hidden">
        <h2 id="end-title">データ送信中...</h2>
        <p id="end-text">そのままお待ちください。</p>
    </div>

    <script>
        // 你的专属 Google Apps Script 网址
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyyTEOXxPEE5qRsNeBm6CbKNmvh83K9Fhn-SGVTojw-SRrtm9X-lyFGvp0cHFWiVmDj/exec";
        
        const videoFiles = [
            'videos_compressed/r1.mp4', 
            'videos_compressed/r2.mp4', 
            'videos_compressed/r3.mp4', 
            'videos_compressed/r4.mp4', 
            'videos_compressed/r5.mp4'
        ];
        let currentTrial = 0;
        let subjectId = '';
        let experimentData = [];
        let clicksInCurrentTrial = 0;

        const videoElement = document.getElementById('stimulus-video');
        const videoContainer = document.getElementById('video-container');

        function startExperiment() {
            // 自动生成一个类似 Anon_8X3B9 的随机匿名ID
            subjectId = 'Anon_' + Math.random().toString(36).substring(2, 7).toUpperCase();
            
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('experiment-screen').classList.remove('hidden');
            loadNextVideo();
        }

        function loadNextVideo() {
            if (currentTrial >= videoFiles.length) {
                finishExperiment();
                return;
            }
            clicksInCurrentTrial = 0;
            document.getElementById('trial-counter').innerText = `Trial ${currentTrial + 1} / ${videoFiles.length}`;
            videoElement.src = videoFiles[currentTrial];
            videoElement.play();
        }

        // 监听视频点击（允许多次点击）
        videoElement.addEventListener('click', function(event) {
            clicksInCurrentTrial++; 

            const clickTime = videoElement.currentTime;
            const rect = videoElement.getBoundingClientRect();
            
            const xPos = event.clientX - rect.left;
            const yPos = event.clientY - rect.top;

            const xPercent = (xPos / rect.width) * 100;
            const yPercent = (yPos / rect.height) * 100;

            experimentData.push({
                subject_id: subjectId,
                video_name: videoFiles[currentTrial].replace('videos_compressed/', ''),
                click_time: clickTime.toFixed(3),
                x_percent: xPercent.toFixed(2),
                y_percent: yPercent.toFixed(2)
            });

            // 动态生成红圈特效
            const marker = document.createElement('div');
            marker.className = 'click-marker';
            marker.style.left = `${xPos}px`;
            marker.style.top = `${yPos}px`;
            videoContainer.appendChild(marker);

            setTimeout(() => { marker.remove(); }, 600);
        });

        // 核心修改：视频必须播完才进入下一个
        videoElement.addEventListener('ended', function() {
            if (clicksInCurrentTrial === 0) {
                experimentData.push({
                    subject_id: subjectId, 
                    video_name: videoFiles[currentTrial].replace('videos_compressed/', ''),
                    click_time: -1, x_percent: -1, y_percent: -1
                });
            }
            currentTrial++;
            loadNextVideo();
        });

        // 发送数据到谷歌表格
        function finishExperiment() {
            document.getElementById('experiment-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(experimentData)
            }).then(response => {
                document.getElementById('end-title').innerText = "実験終了";
                document.getElementById('end-text').innerText = "ご協力ありがとうございました。ブラウザを閉じてください。";
            }).catch(error => {
                console.error(error);
                document.getElementById('end-title').innerText = "送信エラー";
                document.getElementById('end-text').innerText = "代わりに結果ファイルをダウンロードしました。担当者に送信してください。";
                downloadCSVFallback();
            });
        }

        // 断网备用下载 CSV
        function downloadCSVFallback() {
            let csvContent = "Subject_ID,Video_Name,Click_Time_Sec,Click_X_Percent,Click_Y_Percent\n";
            experimentData.forEach(row => { csvContent += `${row.subject_id},${row.video_name},${row.click_time},${row.x_percent},${row.y_percent}\n`; });
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Result_${subjectId}_Offline.csv`;
            document.body.appendChild(link);
            link.click();
        }
    </script>
</body>
</html>
